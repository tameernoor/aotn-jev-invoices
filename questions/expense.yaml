# Expense invoice questions. All are sent to Jev in one request and every one is read by a rule.
# Ids are never sent to the model, so each instruction carries the whole question.
# Keys "true" and "false" are quoted so YAML keeps them as strings.

# What was bought is asked per line; see questions.line_questions.

# Policy and documentation controls. The common expense claim problems.

food_for_several:
  type: noul
  instructions: Does `invoice_text` show food or drink for more than one person?
  criteria:
    "true": The lines show meals or drinks for two or more people, for example "3 x Hovedrett" or two main courses.
    "false": The food or drink is for one person, or there is no food or drink.

diners_named:
  type: noul
  instructions: Does `expense_purpose` say who ate or drank, by name, company or group?
  criteria:
    "true": 'At least one person, company or group who ate or drank is named, for example "Per Lund from Sølvtind Rør AS" or "the project group".'
    "false": '`expense_purpose` does not say who ate or drank, for example "customer dinner" or "dinner".'

purpose_fits_receipt:
  type: noul
  instructions: Do most of the lines in `invoice_text` fit the purpose given in `expense_purpose`? A single private item does not make the answer no.
  criteria:
    "true": The purpose describes what was bought, or the purpose does not say what was bought.
    "false": The purpose describes something clearly different from what was bought, for example a train ticket when the receipt is for a restaurant.

receipt_kind:
  type: choice
  instructions: What kind of document is `invoice_text`?
  criteria:
    proof_of_purchase: A receipt, ticket or invoice that shows what was bought and its price.
    card_slip: A payment terminal slip that shows only the card payment and the total, not what was bought.
    booking_confirmation: A confirmation of a booking or order, not proof of payment.
    other: Any other document.

purpose_detail:
  type: score
  instructions: How specific is `expense_purpose` about the work this expense was for?
  criteria:
    - Missing, or a single generic word with no subject, such as "meeting", "work" or "travel".
    - Names what kind of work it was, such as "project meeting", "sales course", "customer dinner" or "trip home from a conference".
    - Names the specific event, project or people, such as "contract law course" or "dinner with Hansen from Acme AS".
