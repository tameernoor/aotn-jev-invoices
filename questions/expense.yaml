# Expense invoice questions. All are sent to Jev in one request and every one is read by a rule.
# Ids are never sent to the model, so each instruction carries the whole question.
# Keys "true" and "false" are quoted so YAML keeps them as strings.

# What was bought. Code counts the kinds and picks the VAT code.

lodging_charged:
  type: noul
  instructions: Does `invoice_text` charge for a room or other overnight stay?

served_food_charged:
  type: noul
  instructions: Does `invoice_text` charge for food served to eat on the spot, such as a restaurant meal, room service or a breakfast on its own line?
  criteria:
    "true": At least one line is food served at a restaurant, cafe, hotel or similar.
    "false": No served food is charged. Groceries to take away and breakfast included in the room price without its own line count as no.

alcohol_charged:
  type: noul
  instructions: Does `invoice_text` charge for at least one alcoholic drink?
  criteria:
    "true": At least one line is beer, wine, cider, spirits or another alcoholic drink, including minibar items.
    "false": No line is an alcoholic drink.

transport_charged:
  type: noul
  instructions: Does `invoice_text` charge for carrying a person from one place to another, such as a taxi ride or a train, bus, ferry or flight ticket?
  criteria:
    "true": At least one line is a ride or a ticket for a person.
    "false": No ride or ticket is charged. Parking, fuel and car rental count as no.

goods_charged:
  type: noul
  instructions: Does `invoice_text` charge for goods to take away, such as equipment, office supplies or toiletries?
  criteria:
    "true": At least one line is an item the buyer takes away.
    "false": No such item is charged. Food and drinks consumed on the spot, including the minibar, count as no.

# Policy and documentation controls. The common expense claim problems.

hosted_guests:
  type: noul
  instructions: Did this expense pay for guests from outside the company, such as customers or suppliers? Use `expense_purpose` together with `invoice_text`.
  criteria:
    "true": The expense includes hosting people from outside the company, for example a meal or event with customers or suppliers.
    "false": Only the employee or colleagues used what was paid for, even if the trip was to meet someone outside the company.

purpose_fits_receipt:
  type: noul
  instructions: Do the main items charged in `invoice_text` fit the purpose given in `expense_purpose`?
  criteria:
    "true": What was mainly bought is what the purpose describes.
    "false": What was mainly bought is something the purpose does not describe.

personal_items:
  type: noul
  instructions: Does `invoice_text` charge for at least one item for private use, such as clothing, cosmetics, perfume, toiletries, films or gifts for family?
  criteria:
    "true": At least one line is an item most employers would treat as private.
    "false": Every line is something a business would normally pay for.

receipt_kind:
  type: choice
  instructions: What kind of document is `invoice_text`?
  criteria:
    itemised_receipt: A receipt that lists what was bought, line by line, with prices.
    ticket: A travel ticket that shows the journey and the price paid.
    invoice: An invoice from the seller, with an invoice number and what was charged.
    card_slip: A payment terminal slip that shows only the card payment and the total, not what was bought.
    booking_confirmation: A confirmation of a booking or order, not proof of payment.
    other: Any other document.

purpose_detail:
  type: score
  instructions: How specific is `expense_purpose` about the work this expense was for?
  criteria:
    - Missing or generic, such as "meeting", "work" or "travel", without saying what the work was.
    - Says what the work was, such as a named course, meeting, fair or trip, but not who took part.
    - Says what the work was and names who took part, for example the guests' names or their company.
