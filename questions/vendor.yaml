# Vendor invoice questions. Jev reads descriptions only; amounts, dates, invoice numbers
# and bank accounts are compared in code. Code adds one duplicate question per earlier
# invoice at request time (see questions.duplicate_questions).

po_items_billed:
  type: noul
  instructions: Do the lines in `invoice_text` charge for the goods or services described in `purchase_order`? Judge the descriptions only, not quantities, prices or totals.
  criteria:
    "true": The lines name the same goods or services as `purchase_order`.
    "false": The lines name other goods or services, or are too general to tell.

unordered_items:
  type: noul
  instructions: Does `invoice_text` charge for at least one named item or service that `purchase_order` does not include?
  criteria:
    "true": At least one line names goods or services that are not in `purchase_order`.
    "false": Every named line is in `purchase_order`.

bank_change_request:
  type: noul
  instructions: Does `invoice_text` ask for payment to a new, changed or different bank account?
  criteria:
    "true": The text says payment should go to a new, changed or different account.
    "false": The text only states where to pay, with no mention of a change.

payment_pressure:
  type: noul
  instructions: Does `invoice_text` push for immediate payment or for skipping the normal approval of invoices?
  criteria:
    "true": The text demands payment the same day or within hours, threatens to stop deliveries, or says the invoice should not go through normal approval.
    "false": The text gives an ordinary due date without pressure.

document_kind:
  type: choice
  instructions: What kind of document is `invoice_text`?
  criteria:
    invoice: An invoice asking for payment for goods or services.
    credit_note: A credit note reducing an earlier invoice.
    reminder: A payment reminder about an invoice already sent.
    account_statement: A statement listing several invoices or the balance on an account.
    order_confirmation: A confirmation of an order, not a request for payment.
    other: Any other document.

line_specificity:
  type: score
  instructions: How specifically do the lines in `invoice_text` describe what was delivered?
  criteria:
    - Generic, such as "services", "consulting" or "miscellaneous", without saying what was done or delivered.
    - Names the kind of goods or service, but not the items, quantities or work done.
    - Names the items, quantities or the work done.
