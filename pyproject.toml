[project]
name = "jev-invoices"
version = "0.1.0"
description = "Jev judges invoices, code decides. Companion code for an article."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typesafe-sdk>=0.7.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_invoices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real TypeSafe API, needs TYPESAFE_API_KEY"]
